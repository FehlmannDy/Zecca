<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zecca preview</title></head>
<body style="font-family:system-ui;padding:24px">
<p>Opening the preview…</p>
<script>
// Preview only (mock API in the browser, NEXT_PUBLIC_API_MOCK=1): signs you in as a demo person without sign-up.
// /preview.html?as=carla -> user home, ?as=bruno -> merchant space. Nothing real is created.
(function () {
  var people = {
    carla: { home: '/app', user: { id: 'usr_carla', role: ['user'], handle: 'carla', displayName: 'Carla Rossi', address: 'r34PYpD846aYCuym5oJzRmNsGUbyjV2UYD', tier: 1, createdAt: '2026-11-21T08:40:00.000Z' }, publicKey: '03C6D0E4F8A2B6C0D4E8F2A6B0C4D8E2F6A0B4C8D2E6F0A4B8C2D6E0F4A8B2C6D0' },
    bruno: { home: '/merchant', user: { id: 'usr_bruno', role: ['user', 'merchant'], handle: 'caffebruno', displayName: 'Bruno Esposito', address: 'rsvhMtAFLX2HvJgXEvZGeqTviucdndHuFN', email: 'bruno@example.com', tier: 0, createdAt: '2026-11-21T08:35:00.000Z', merchant: { businessName: 'Caffè Bruno', feeBps: 50 } }, publicKey: '02B5C9D3E7F1A5B9C3D7E1F5A9B3C7D1E5F9A3B7C1D5E9F3A7B1C5D9E3F7A1B5C9' }
  };
  var who = new URLSearchParams(location.search).get('as') || 'carla';
  var p = people[who] || people.carla;
  var token = 'mock_preview_' + who;
  var data = {};
  try { data = JSON.parse(localStorage.getItem('zecca.mockapi.v1') || '{}') || {}; } catch (e) { data = {}; }
  data.sessions = data.sessions || {};
  data.sessions[token] = { address: p.user.address, publicKey: p.publicKey };
  localStorage.setItem('zecca.mockapi.v1', JSON.stringify(data));
  localStorage.setItem('zecca.session', JSON.stringify({ token: token, address: p.user.address, publicKey: p.publicKey, signer: 'mock', user: p.user }));
  location.replace(p.home);
})();
</script>
</body>
</html>
